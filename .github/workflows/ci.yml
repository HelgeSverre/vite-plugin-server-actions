name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vite 8 (dev toolchain) requires Node ^20.19 || >=22.12
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install example dependencies
        run: |
          cd examples/svelte-todo-app && npm ci
          cd ../vue-todo-app && npm ci
          cd ../react-todo-app && npm ci
          cd ../react-todo-app-typescript && npm ci
          cd ../alpine-todo-app && npm ci
          cd ../typescript-analytics-demo && npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Build example app
        run: npm run build
        working-directory: examples/svelte-todo-app

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
