name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `registry-url` — it makes setup-node write an .npmrc with a
      # placeholder auth token, which npm then uses instead of falling back to
      # OIDC. Omitting it lets Trusted Publishing (OIDC) engage against the
      # default registry (registry.npmjs.org).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x" # >= 22.14.0 required for OIDC trusted publishing

      - name: Upgrade npm
        run: npm install -g npm@latest # >= 11.5.1 required for OIDC trusted publishing

      - name: Install dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/svelte-todo-app

      - name: Run tests
        run: npm run check

      # No NODE_AUTH_TOKEN: authentication is handled via OIDC (Trusted Publishing),
      # and provenance attestations are generated automatically.
      - name: Publish to npm
        run: npm publish
