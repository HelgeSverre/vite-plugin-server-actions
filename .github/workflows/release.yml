name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      # Matches npm's official Trusted Publishing example: setup-node@v6 is
      # OIDC-aware, so registry-url can stay set without the placeholder-token
      # behavior that blocked OIDC on v4.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24" # >= 22.14.0 required for OIDC trusted publishing
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Upgrade npm
        run: npm install -g npm@latest # >= 11.5.1 required for OIDC trusted publishing

      - name: Install dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/svelte-todo-app

      - name: Run tests
        run: npm run check

      # No NODE_AUTH_TOKEN: authentication is handled via OIDC (Trusted
      # Publishing) and provenance attestations are generated automatically.
      # --loglevel verbose surfaces the OIDC exchange so failures are diagnostic.
      - name: Publish to npm
        run: npm publish --loglevel verbose
